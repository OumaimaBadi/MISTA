# @package dataset/aist_d14_adv

dataset_name: aist_d14_adv

dataset:
  name: zjumocap
  root_dir: "/data/"
  subject: d14/gLO_sFM_cAll_mLO4_ch12
  refine: false

  # Views
  train_views: [ '1' ]
  val_views: [ '2', '3', '4', '5','6', '7', '8', '9' ]
  test_views:
    view:  [ '2', '3', '4', '5','6', '7', '8', '9' ]
    video: [ '2' ]
    all:   []
  predict_views: [ '1']

  # Frames (start, end, step)
  train_frames: [ 0, 1917, 1 ]
  val_frames: [ 0, 1, 1 ]
  test_frames:
    view:  [ 0, 1917, 30 ]
    video: [ 0, 0, 1 ]
    all:   [ 0, 0, 1 ]
  predict_frames: [ 0, 0, 1 ]

  # Target training resolution
  img_hw:
    - 540
    - 960

  # Native/original dataset resolution
  orig_hw:
    - 1080  # original height
    - 1920  # original width

  lanczos: false
  resolution: -1
  
  data_device: cuda
  eval: false
