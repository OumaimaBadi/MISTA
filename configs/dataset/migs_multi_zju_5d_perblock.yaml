# @package _global_
defaults:
  - zju_386_mono@datasets.zju_386_mono
  - zju_387_mono@datasets.zju_387_mono
  - zju_377_mono@datasets.zju_377_mono
  - zju_392_mono@datasets.zju_392_mono
  - zju_315_mono@datasets.zju_315_mono
  - zju_394_mono@datasets.zju_394_mono
  - zju_390_mono@datasets.zju_390_mono
  - zju_393_mono@datasets.zju_393_mono
  # - zju_313_mono@datasets.zju_313_mono   # optional extra person

dataset:
  name: MultiPersonZJUMoCap
  names: [
    'zju_386_mono',
    'zju_387_mono',
    'zju_377_mono',
    'zju_392_mono',
    'zju_315_mono',
    'zju_394_mono',
    'zju_393_mono',
    'zju_390_mono'
  ]

migs:
  type: tt5d_perblock
  delay: 1000
  rank: null
  tt_shape: null
  verbose: true
  add_identity: false
  gaussian_vis:
    iterations: [1000, 5000, 10000, 20000, 30000, 40000, 50000]

  use_mars: false
  
  tt_lrs: [1.6e-4, 1.6e-4, 1.6e-4, 1.6e-4]
  tt_final_lrs: [1.6e-6, 1.6e-6, 1.6e-6, 1.6e-6]

  mars:
    pi: 1e-2
    alpha: -1.0
    temperature: 0.1
    sigma_inv: 0.1
    gamma: -0.1
    zeta: 1.1
    reg_coef: 1e-4
    eval_logits_threshold: 0.0
    eval_sample: false
    ste: false
    warmup_iters: 6000


# Optional: pick a single person appearance globally
appearance_identity: null
